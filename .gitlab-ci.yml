image: python:3.13-slim

stages:
  - quality

great_expectations:
  stage: quality

  before_script:
    - python --version
    - pip install --upgrade pip
    - pip install -r requirements.txt

  script:
    - python src/run_checkpoint.py

  artifacts:
    when: always
    paths:
      - gx/uncommitted/data_docs/local_site/
      - gx/uncommitted/validations/
    expire_in: 1 week
